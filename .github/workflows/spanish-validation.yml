name: Spanish conversion validation
run-name: Spanish conversion validation (${{ github.ref_name }})

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: spanish-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Spanish conversion validator
        run: npm run validate:spanish

      - name: Upload Spanish validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spanish-validation-${{ github.run_number }}
          path: |
            tests/validators/reports/
          if-no-files-found: warn
          retention-days: 14

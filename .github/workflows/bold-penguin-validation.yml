name: Bold Penguin validation

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: bold-penguin-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Optional repository variable. If empty, the validator uses url.csv.
      BASE_URL: ${{ vars.BASE_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Bold Penguin validator
        run: npm run validate:ci

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bold-penguin-validation-${{ github.run_number }}
          path: |
            reports/
            screenshots/
          if-no-files-found: warn
          retention-days: 14

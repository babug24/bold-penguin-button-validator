name: All scripts

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: all-scripts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run all scripts (skip missing)
        shell: bash
        run: |
          set -euo pipefail

          node -e "const pkg=require('./package.json'); const scripts=pkg.scripts||{}; const desired=[
            'test:e2e',
            'test:e2e:sanity',
            'test:e2e:spanish',
            'test:e2e:smoke',
            'test:e2e:regression',
            'validate',
            'validate:sanity',
            'validate:spanish',
            'validate:smoke',
            'validate:regression',
            'validate:mobile',
            'validate:all',
            'validate:ci',
            'validate:e2e'
          ];
          for (const name of desired) {
            if (!scripts[name]) {
              console.log('SKIP ' + name + ' (missing from package.json)');
              continue;
            }
            console.log('RUN  ' + name);
            console.log('::group::npm run ' + name);
            const {spawnSync}=require('child_process');
            const res=spawnSync('npm',['run',name],{stdio:'inherit'});
            console.log('::endgroup::');
            if (res.status !== 0) process.exit(res.status ?? 1);
          }"

      - name: Upload reports and artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: all-scripts-${{ github.run_number }}
          path: |
            reports/
            screenshots/
            test-results/
            tests/validators/reports/
          if-no-files-found: warn
          retention-days: 14
